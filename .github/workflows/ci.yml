name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn test

  install-check:
    name: Install script check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -q verify 

      # Linux/macos run install.sh
      - name: Install (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash ./install.sh 

          # Ensure job PATH has installed bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Windows run install.p1
      - name : Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1

          # Ensure job PATH has installed bin
          "$env:LOCALAPPDATA\javaWhitelist" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v javaWhitelist
          javaWhitelist --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command javaWhitelist
          javaWhitelist --version
